<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc">
  <title id="title">使用 /team-lead 时你会看到什么</title>
  <desc id="desc">示意：你用 /team-lead 发起任务，并要求写文档的队员跟随队长；队长确认前提，拆成三块，逐位登记路由并创建队员；每位队员创建后都有一行 member-model 说明，写明在运行中的队员身上核实过的实际路由；最后队长按 applied 汇报。</desc>
  <defs>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#145AF3" flood-opacity="0.104"/>
    </filter>
    <clipPath id="win"><rect x="0" y="0" width="1200" height="668" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Hiragino Sans GB', sans-serif; }
    .latin { font-family: 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', monospace; }
  </style>
  <g clip-path="url(#win)">
    <rect width="1200" height="668" fill="#F7FAFF"/>
    <rect width="1200" height="46" fill="#EEF3FB"/>
    <line x1="0" y1="46" x2="1200" y2="46" stroke="#DCE6F7" stroke-width="1.2"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="666.5" rx="17.5" fill="none" stroke="#E1EAF8" stroke-width="1.5"/>
  <circle cx="28" cy="23" r="6.5" fill="#FF5F57" fill-opacity="0.9"/>
  <circle cx="50" cy="23" r="6.5" fill="#FEBC2E" fill-opacity="0.9"/>
  <circle cx="72" cy="23" r="6.5" fill="#28C840" fill-opacity="0.9"/>
  <text x="600.0" y="28.5" text-anchor="middle" class="sans" font-size="14.5" font-weight="600" fill="#5A6A8B">DeepSeek Harness · 智能体团队</text>
  <circle cx="60" cy="92" r="19" fill="#F2AF63"/>
  <circle cx="60" cy="88.50" r="4.12" fill="#FFFFFF"/><path d="M52.50 101.00 C52.50 95.00 56.00 93.62 60.00 93.62 C64.00 93.62 67.50 95.00 67.50 101.00 Z" fill="#FFFFFF"/>
  <text x="98" y="86" class="sans" font-size="15" font-weight="700" fill="#0B1B3F">你</text>
  <rect x="96" y="96" width="960" height="40" rx="12" fill="#E8F0FF" stroke="#CADCFD" stroke-width="1.1"/>
  <text x="112" y="122" class="sans" font-size="16.5" fill="#22324F"><tspan class="mono" font-weight="700" fill="#145AF3">/team-lead</tspan> 给 kernel-check 和 sync-skill 各加一个 --json 输出，补上测试，更新 README；写文档的那位跟随队长就行</text>
  <rect x="40" y="162" width="40" height="40" rx="11" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.2"/>
  <g transform="translate(43.8 165.8) scale(0.9)">
    <circle cx="11.5" cy="12" r="4" fill="#145AF3"/>
    <path d="M4.5 25C4.5 21.134 7.634 18 11.5 18C15.366 18 18.5 21.134 18.5 25V27H4.5V25Z" fill="#7CB7FF"/>
    <rect x="18.5" y="10.9" width="7.5" height="2.2" rx="1.1" fill="#F2AF63"/>
    <path d="M24.2 7.6L29 12L24.2 16.4V7.6Z" fill="#F2AF63"/>
    <rect x="21" y="18" width="10" height="9" rx="2.5" fill="#45D9E7"/>
    <rect x="23.6" y="21.6" width="4.8" height="1.8" rx="0.9" fill="#FFFFFF"/>
  </g>
  <text x="98" y="176" class="sans" font-size="15" font-weight="700" fill="#0B1B3F">队长</text>
  <rect x="138" y="161" width="82" height="21" rx="10.5" fill="#F1F5FD" stroke="#DCE6F7"/>
  <text x="179" y="175.5" text-anchor="middle" class="latin" font-size="12" font-weight="600" fill="#5A6A8B">team-lead</text>
  <text x="98" y="206" class="sans" font-size="16.5" fill="#22324F">前提检查：</text>
  <circle cx="194" cy="200.5" r="8" fill="#2EA44F"/><path d="M190.65 200.65 L192.98 202.97 L197.49 198.03" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="208" y="206" class="sans" font-size="16.5" fill="#22324F">智能体团队</text>
  <circle cx="314" cy="200.5" r="8" fill="#2EA44F"/><path d="M310.65 200.65 L312.98 202.97 L317.49 198.03" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="328" y="206" class="sans" font-size="16.5" fill="#22324F">member-model 1.2.0</text>
  <text x="98" y="234" class="sans" font-size="16.5" fill="#22324F">拆成三块，按「登记 → 创建」逐位建队员：kc-json、sync-json 用默认路由，docs 按你的要求跟随队长。</text>
  <rect x="98" y="254" width="318" height="32" rx="16" fill="#F1F5FD" stroke="#DCE6F7" stroke-width="1.1"/>
  <text x="114" y="275" class="mono" font-size="14" font-weight="700" fill="#145AF3">arm_spawn_route</text>
  <text x="250" y="275" class="latin" font-size="14" fill="#8A9BBD">→</text>
  <text x="272" y="275" class="mono" font-size="14" font-weight="700" fill="#0A8A9E">spawn_teammate</text>
  <text x="432" y="275.5" class="latin" font-size="15" font-weight="700" fill="#5A6A8B">×3</text>
  <rect x="470" y="254" width="94" height="32" rx="16" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.1"/>
  <circle cx="486" cy="270" r="5" fill="#145AF3"/>
  <text x="497" y="275" class="mono" font-size="14" font-weight="700" fill="#0B1B3F">kc-json</text>
  <rect x="573.5" y="254" width="110" height="32" rx="16" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.1"/>
  <circle cx="589.5" cy="270" r="5" fill="#F2AF63"/>
  <text x="600.5" y="275" class="mono" font-size="14" font-weight="700" fill="#0B1B3F">sync-json</text>
  <rect x="694.0" y="254" width="68" height="32" rx="16" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.1"/>
  <circle cx="710.0" cy="270" r="5" fill="#45D9E7"/>
  <text x="721.0" y="275" class="mono" font-size="14" font-weight="700" fill="#0B1B3F">docs</text>
  <rect x="96" y="306" width="1068" height="112" rx="12" fill="#DAFBE1" fill-opacity="0.55" stroke="#AEE9BD" stroke-width="1.1"/>
  <rect x="96" y="306" width="5" height="112" rx="2.5" fill="#2EA44F"/>
  <circle cx="120" cy="333" r="8.5" fill="#2EA44F"/><path d="M116.45 333.15 L118.92 335.63 L123.71 330.37" fill="none" stroke="#FFFFFF" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="338" class="mono" font-size="14.5" fill="#22324F"><tspan fill="#1A7F37" font-weight="700">member-model:</tspan> "kc-json" → <tspan font-weight="700" fill="#0B1B3F">provider-a/model-a · high</tspan> <tspan fill="#5A6A8B">(armed route; verified on the live teammate).</tspan></text>
  <circle cx="120" cy="363" r="8.5" fill="#2EA44F"/><path d="M116.45 363.15 L118.92 365.63 L123.71 360.37" fill="none" stroke="#FFFFFF" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="368" class="mono" font-size="14.5" fill="#22324F"><tspan fill="#1A7F37" font-weight="700">member-model:</tspan> "sync-json" → <tspan font-weight="700" fill="#0B1B3F">provider-a/model-a · high</tspan> <tspan fill="#5A6A8B">(armed route; verified on the live teammate).</tspan></text>
  <circle cx="120" cy="393" r="8.5" fill="#2EA44F"/><path d="M116.45 393.15 L118.92 395.63 L123.71 390.37" fill="none" stroke="#FFFFFF" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="398" class="mono" font-size="14.5" fill="#22324F"><tspan fill="#1A7F37" font-weight="700">member-model:</tspan> "docs" → <tspan font-weight="700" fill="#0B1B3F">provider-b/model-b · medium</tspan> <tspan fill="#5A6A8B">(armed follow, same as the lead; verified on the live teammate).</tspan></text>
  <rect x="40" y="444" width="40" height="40" rx="11" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.2"/>
  <g transform="translate(43.8 447.8) scale(0.9)">
    <circle cx="11.5" cy="12" r="4" fill="#145AF3"/>
    <path d="M4.5 25C4.5 21.134 7.634 18 11.5 18C15.366 18 18.5 21.134 18.5 25V27H4.5V25Z" fill="#7CB7FF"/>
    <rect x="18.5" y="10.9" width="7.5" height="2.2" rx="1.1" fill="#F2AF63"/>
    <path d="M24.2 7.6L29 12L24.2 16.4V7.6Z" fill="#F2AF63"/>
    <rect x="21" y="18" width="10" height="9" rx="2.5" fill="#45D9E7"/>
    <rect x="23.6" y="21.6" width="4.8" height="1.8" rx="0.9" fill="#FFFFFF"/>
  </g>
  <text x="98" y="458" class="sans" font-size="15" font-weight="700" fill="#0B1B3F">队长</text>
  <text x="98" y="488" class="sans" font-size="16.5" fill="#22324F">验收完成：改动、测试和 README 都已核对。各队员的实际路由（<tspan class="mono" fill="#145AF3">applied</tspan>）：</text>
  <rect x="96" y="504" width="1068" height="110" rx="12" fill="#FFFFFF" stroke="#DCE7FB" stroke-width="1.1"/>
  <text x="116" y="530" class="mono" font-size="14.5" font-weight="700" fill="#0B1B3F">kc-json</text>
  <text x="248" y="530" class="mono" font-size="14" fill="#5A6A8B">kernel-check --json</text>
  <text x="468" y="530" class="mono" font-size="14.5" font-weight="600" fill="#22324F">provider-a/model-a · high</text>
  <circle cx="758" cy="525" r="8" fill="#2EA44F"/><path d="M754.65 525.15 L756.98 527.47 L761.49 522.53" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="774" y="530" class="sans" font-size="14.5" font-weight="600" fill="#1A7F37">已核实</text>
  <line x1="110" y1="542" x2="1152" y2="542" stroke="#DCE6F7" stroke-width="1"/>
  <text x="116" y="564" class="mono" font-size="14.5" font-weight="700" fill="#0B1B3F">sync-json</text>
  <text x="248" y="564" class="mono" font-size="14" fill="#5A6A8B">sync-skill --json</text>
  <text x="468" y="564" class="mono" font-size="14.5" font-weight="600" fill="#22324F">provider-a/model-a · high</text>
  <circle cx="758" cy="559" r="8" fill="#2EA44F"/><path d="M754.65 559.15 L756.98 561.47 L761.49 556.53" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="774" y="564" class="sans" font-size="14.5" font-weight="600" fill="#1A7F37">已核实</text>
  <line x1="110" y1="576" x2="1152" y2="576" stroke="#DCE6F7" stroke-width="1"/>
  <text x="116" y="598" class="mono" font-size="14.5" font-weight="700" fill="#0B1B3F">docs</text>
  <text x="248" y="598" class="mono" font-size="14" fill="#5A6A8B">README</text>
  <text x="468" y="598" class="mono" font-size="14.5" font-weight="600" fill="#22324F">provider-b/model-b · medium</text>
  <circle cx="758" cy="593" r="8" fill="#2EA44F"/><path d="M754.65 593.15 L756.98 595.47 L761.49 590.53" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="774" y="598" class="sans" font-size="14.5" font-weight="600" fill="#1A7F37">已核实 · 跟随队长</text>
  <text x="1164" y="644" text-anchor="end" class="sans" font-size="13" fill="#8A9BBD">示意 · provider / model 均为示例值</text>
</svg>
